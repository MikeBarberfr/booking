<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Espace pro — Réservation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14120f; --surface: #1f1c17; --surface-2: #2a251d;
    --cream: #f1e9db; --muted: #a89c88; --accent-red: #b4392c;
    --accent-brass: #c9a35a; --border: #3a332a; --green:#5fa06a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif; }
  .display { font-family:'Oswald',sans-serif; letter-spacing:.03em; text-transform:uppercase; }
  .stripebar { height:6px; width:100%; background: repeating-linear-gradient(-45deg, var(--accent-red) 0 10px, var(--cream) 10px 20px, var(--accent-brass) 20px 30px); }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:var(--surface); }
  main { max-width:900px; margin:0 auto; padding:24px 16px 60px; }
  .tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:20px; }
  .tab-btn { flex:0 0 auto; padding:8px 14px; border-radius:6px; background:var(--surface); border:1px solid var(--border); color:var(--cream); cursor:pointer; font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:12px; }
  .tab-btn.active { background:var(--accent-red); border-color:var(--accent-red); }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:18px; margin-bottom:16px; }
  .panel h3 { margin:0 0 14px; color:var(--accent-brass); font-size:14px; }
  label.field { display:block; margin-bottom:10px; font-size:14px; }
  label.field span { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input, select { width:100%; padding:9px 11px; border-radius:6px; background:transparent; border:1px solid var(--border); color:var(--cream); font-size:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .btn { padding:10px 18px; border-radius:6px; border:none; cursor:pointer; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:13px; }
  .btn-primary { background:var(--accent-red); color:var(--cream); }
  .btn-gold { background:var(--accent-brass); color:var(--bg); }
  .btn-ghost { background:transparent; color:var(--cream); border:1px solid var(--border); }
  .btn-icon { padding:6px 9px; }
  .booking-row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--surface-2); border-radius:6px; padding:8px 10px; margin-bottom:8px; font-size:14px; }
  .badge { font-size:10px; text-transform:uppercase; padding:2px 8px; border-radius:99px; }
  .badge.en_attente { color:var(--accent-brass); border:1px solid var(--accent-brass); }
  .badge.confirme { color:var(--green); border:1px solid var(--green); }
  .badge.annule { color:var(--accent-red); border:1px solid var(--accent-red); }
  .service-row, .hour-row { display:flex; gap:10px; align-items:center; background:var(--surface-2); border-radius:6px; padding:8px 10px; margin-bottom:8px; font-size:14px; flex-wrap:wrap; }
  .muted { color:var(--muted); }
  .hidden { display:none; }
  .login-box { max-width:320px; margin:60px auto; text-align:center; }
  .error { color:var(--accent-red); font-size:13px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:600px){ .grid2{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="loginView" class="login-box">
  <p class="display" style="font-size:20px">Espace pro</p>
  <label class="field"><span>Email</span><input id="loginEmail" type="email" /></label>
  <label class="field"><span>Mot de passe</span><input id="loginPass" type="password" /></label>
  <p id="loginError" class="error hidden"></p>
  <button class="btn btn-primary" style="width:100%" onclick="login()">Se connecter</button>
</div>

<div id="appView" class="hidden">
  <header>
    <span class="display" id="bizNameAdmin">Espace pro</span>
    <button class="btn btn-ghost" onclick="logout()">Déconnexion</button>
  </header>
  <div class="stripebar"></div>
  <main>
    <div class="tabs">
      <button class="tab-btn active" data-tab="agenda" onclick="showTab('agenda')">Agenda</button>
      <button class="tab-btn" data-tab="services" onclick="showTab('services')">Prestations</button>
      <button class="tab-btn" data-tab="hours" onclick="showTab('hours')">Horaires</button>
      <button class="tab-btn" data-tab="settings" onclick="showTab('settings')">Réglages</button>
    </div>

    <div id="tab-agenda" class="tab-panel">
      <div class="row" style="margin-bottom:14px">
        <button class="btn btn-ghost btn-icon" onclick="shiftWeek(-7)">&larr;</button>
        <span id="weekLabel" class="muted"></span>
        <button class="btn btn-ghost btn-icon" onclick="shiftWeek(7)">&rarr;</button>
      </div>
      <div id="agendaDays"></div>
    </div>

    <div id="tab-services" class="tab-panel hidden">
      <div class="panel">
        <h3>Ajouter une prestation</h3>
        <div class="grid2">
          <label class="field"><span>Nom</span><input id="svcName" placeholder="Coupe homme" /></label>
          <label class="field"><span>Durée (min)</span><input id="svcDuration" type="number" value="30" /></label>
          <label class="field"><span>Prix (€, optionnel)</span><input id="svcPrice" type="number" /></label>
        </div>
        <button class="btn btn-gold" onclick="addService()">Ajouter</button>
      </div>
      <div class="panel"><h3>Prestations actuelles</h3><div id="servicesList"></div></div>
    </div>

    <div id="tab-hours" class="tab-panel hidden">
      <div class="panel"><h3>Horaires hebdomadaires</h3><div id="hoursList"></div></div>
      <div class="panel">
        <h3>Fermetures exceptionnelles</h3>
        <div class="row"><input id="closedDateInput" type="date" style="max-width:200px" /><button class="btn btn-gold" onclick="addClosedDate()">Ajouter</button></div>
        <div id="closedDatesList" style="margin-top:10px"></div>
      </div>
    </div>

    <div id="tab-settings" class="tab-panel hidden">
      <div class="panel">
        <h3>Réglages généraux</h3>
        <label class="field"><span>Nom de l'activité</span><input id="setBizName" /></label>
        <label class="field"><span>Email de notification (vous)</span><input id="setEmail" type="email" /></label>
        <label class="field"><span>Montant de l'acompte (€)</span><input id="setDeposit" type="number" /></label>
        <button class="btn btn-primary" onclick="saveSettings()">Enregistrer</button>
      </div>
    </div>
  </main>
</div>

<script src="config.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const cfg = window.APP_CONFIG;
const supabase = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
window.supabase = supabase;

const DAYS_FR = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const MONTHS_FR = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const pad = n => String(n).padStart(2,"0");
const toDateStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtLong = ds => { const d = new Date(ds+"T00:00:00"); return `${DAYS_FR[d.getDay()]} ${d.getDate()} ${MONTHS_FR[d.getMonth()]}`; };

let servicesCache = [];
let weekStart = (() => { const d = new Date(); d.setDate(d.getDate()-d.getDay()); return d; })();

async function checkSession() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) { document.getElementById("loginView").classList.add("hidden"); document.getElementById("appView").classList.remove("hidden"); boot(); }
}

window.login = async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPass").value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  const err = document.getElementById("loginError");
  if (error) { err.textContent = "Identifiants incorrects."; err.classList.remove("hidden"); return; }
  err.classList.add("hidden");
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  boot();
};
window.logout = async () => { await supabase.auth.signOut(); location.reload(); };

async function boot() {
  const { data: s } = await supabase.from("settings").select("*").single();
  document.getElementById("bizNameAdmin").textContent = s?.business_name || "Espace pro";
  document.getElementById("setBizName").value = s?.business_name || "";
  document.getElementById("setEmail").value = s?.barber_email || "";
  document.getElementById("setDeposit").value = s?.deposit_amount || "";
  await loadServices();
  await loadHours();
  await loadClosedDates();
  await loadWeek();
}

window.showTab = (name) => {
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
  document.getElementById(`tab-${name}`).classList.remove("hidden");
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
};

/* ---- Agenda ---- */
window.shiftWeek = (days) => { weekStart.setDate(weekStart.getDate()+days); loadWeek(); };

async function loadWeek() {
  document.getElementById("weekLabel").textContent = `Semaine du ${fmtLong(toDateStr(weekStart))}`;
  const container = document.getElementById("agendaDays");
  container.innerHTML = "";
  for (let i=0;i<7;i++) {
    const d = new Date(weekStart); d.setDate(d.getDate()+i);
    const ds = toDateStr(d);
    const { data: bookings } = await supabase
      .from("bookings")
      .select("*, services(name, duration_minutes)")
      .eq("booking_date", ds)
      .order("start_time");
    const panel = document.createElement("div");
    panel.className = "panel";
    panel.innerHTML = `<h3>${fmtLong(ds)}</h3>` + (
      !bookings || bookings.length === 0
        ? `<p class="muted">Aucune réservation.</p>`
        : bookings.map(b => `
          <div class="booking-row">
            <strong>${b.start_time.slice(0,5)}</strong>
            <span>${b.services?.name || ""}</span>
            <span class="muted">${b.client_name} · ${b.client_phone}</span>
            ${b.client_comment ? `<span class="muted" style="font-style:italic">"${b.client_comment}"</span>` : ""}
            <span class="badge ${b.status}">${b.status === "en_attente" ? "En attente" : b.status === "confirme" ? "Confirmé" : "Annulé"}</span>
            <span style="margin-left:auto; display:flex; gap:6px;">
              ${b.status !== "confirme" ? `<button class="btn btn-gold btn-icon" onclick="setStatus('${b.id}','confirme')">✓</button>` : ""}
              ${b.status !== "annule" ? `<button class="btn btn-ghost btn-icon" onclick="setStatus('${b.id}','annule')">✕</button>` : ""}
              <button class="btn btn-ghost btn-icon" onclick="deleteBooking('${b.id}')">🗑</button>
            </span>
          </div>`).join("")
    );
    container.appendChild(panel);
  }
}
window.setStatus = async (id, status) => { await supabase.from("bookings").update({ status }).eq("id", id); loadWeek(); };
window.deleteBooking = async (id) => { await supabase.from("bookings").delete().eq("id", id); loadWeek(); };

/* ---- Services ---- */
async function loadServices() {
  const { data } = await supabase.from("services").select("*").order("name");
  servicesCache = data || [];
  document.getElementById("servicesList").innerHTML = servicesCache.length === 0
    ? `<p class="muted">Aucune prestation.</p>`
    : servicesCache.map(s => `
      <div class="service-row">
        <span>${s.name} — ${s.duration_minutes} min${s.price ? " — "+s.price+" €" : ""}</span>
        <button class="btn btn-ghost btn-icon" style="margin-left:auto" onclick="removeService('${s.id}')">🗑</button>
      </div>`).join("");
}
window.addService = async () => {
  const name = document.getElementById("svcName").value.trim();
  const duration = Number(document.getElementById("svcDuration").value);
  const price = document.getElementById("svcPrice").value ? Number(document.getElementById("svcPrice").value) : null;
  if (!name || !duration) return;
  await supabase.from("services").insert({ name, duration_minutes: duration, price });
  document.getElementById("svcName").value = "";
  loadServices();
};
window.removeService = async (id) => { await supabase.from("services").update({ active:false }).eq("id", id); loadServices(); };

/* ---- Hours ---- */
async function loadHours() {
  const { data } = await supabase.from("business_hours").select("*").order("weekday");
  document.getElementById("hoursList").innerHTML = (data||[]).map(h => `
    <div class="hour-row">
      <span style="width:100px">${DAYS_FR[h.weekday]}</span>
      <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${h.is_closed?"checked":""} onchange="toggleClosed(${h.weekday}, this.checked)" /> Fermé</label>
      ${!h.is_closed ? `
        <input type="time" value="${h.open_time?.slice(0,5)}" style="max-width:110px" onchange="updateHour(${h.weekday},'open_time',this.value)" />
        <span class="muted">à</span>
        <input type="time" value="${h.close_time?.slice(0,5)}" style="max-width:110px" onchange="updateHour(${h.weekday},'close_time',this.value)" />
      ` : ""}
    </div>`).join("");
}
window.toggleClosed = async (weekday, closed) => { await supabase.from("business_hours").update({ is_closed: closed }).eq("weekday", weekday); loadHours(); };
window.updateHour = async (weekday, field, value) => { await supabase.from("business_hours").update({ [field]: value }).eq("weekday", weekday); };

async function loadClosedDates() {
  const { data } = await supabase.from("closed_dates").select("*").order("closed_date");
  document.getElementById("closedDatesList").innerHTML = (data||[]).map(c => `
    <span style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:4px 10px;margin:0 6px 6px 0;font-size:12px">
      ${c.closed_date} <button style="background:none;border:none;color:var(--muted);cursor:pointer" onclick="removeClosedDate('${c.closed_date}')">✕</button>
    </span>`).join("");
}
window.addClosedDate = async () => {
  const v = document.getElementById("closedDateInput").value;
  if (!v) return;
  await supabase.from("closed_dates").insert({ closed_date: v });
  document.getElementById("closedDateInput").value = "";
  loadClosedDates();
};
window.removeClosedDate = async (ds) => { await supabase.from("closed_dates").delete().eq("closed_date", ds); loadClosedDates(); };

/* ---- Settings ---- */
window.saveSettings = async () => {
  await supabase.from("settings").update({
    business_name: document.getElementById("setBizName").value.trim(),
    barber_email: document.getElementById("setEmail").value.trim(),
    deposit_amount: Number(document.getElementById("setDeposit").value),
  }).eq("id", 1);
  document.getElementById("bizNameAdmin").textContent = document.getElementById("setBizName").value.trim();
};

checkSession();
</script>
</body>
</html>
